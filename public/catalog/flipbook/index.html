<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Farm Direct 2026</title>

<style>
  :root {
    --bg: #14201a;
    --bg-2: #1d2e25;
    --bar: rgba(255,255,255,.08);
    --fg: #f2f6f3;
    --muted: #9db5a6;
    --accent: #7ac943;
    --bar-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    background: radial-gradient(ellipse at center, var(--bg-2) 0%, var(--bg) 100%);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Escenario ---------- */
  .stage {
    position: relative;
    flex: 1 1 auto; min-height: 0;
    display: flex;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: #4b6556 transparent;
  }
  .inner { margin: auto; flex: none; }
  .book { filter: drop-shadow(0 12px 30px rgba(0,0,0,.45)); }
  .page { background: #fff; overflow: hidden; }
  .page img {
    display: block; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity .25s;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  .page.ready img { opacity: 1; }
  .page .spin {
    position: absolute; inset: 0; margin: auto; width: 34px; height: 34px;
    border: 3px solid #dfe7e1; border-top-color: var(--accent);
    border-radius: 50%; animation: rot .8s linear infinite;
  }
  .page.ready .spin { display: none; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- Carga / error ---------- */
  .loader {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); transition: opacity .4s;
    text-align: center; padding: 24px;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .loader .spin-lg {
    width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.15);
    border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite;
  }
  .loader p { color: var(--muted); font-size: 14px; }
  .loader a { color: var(--accent); }
  .loader.error .spin-lg { display: none; }
  .progress {
    position: absolute; left: 0; top: 0; height: 3px; width: 0;
    background: var(--accent); z-index: 6; transition: width .3s, opacity .5s;
  }

  /* ---------- Barra de herramientas ---------- */
  .toolbar {
    flex: none; height: var(--bar-h);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: content-box;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bar);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .toolbar .sep { width: 1px; height: 24px; background: rgba(255,255,255,.15); margin: 0 6px; }
  .btn {
    width: 42px; height: 42px; border: 0; border-radius: 10px;
    background: transparent; color: var(--fg); cursor: pointer;
    display: grid; place-items: center; text-decoration: none;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:active { transform: scale(.93); }
  .btn:disabled { opacity: .3; cursor: default; background: transparent; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .info { min-width: 92px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
  .zoomval { min-width: 46px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (max-width: 520px) {
    .toolbar { gap: 2px; }
    .btn { width: 38px; height: 38px; }
    .info { min-width: 70px; font-size: 13px; }
    .toolbar .sep { margin: 0 2px; }
    .zoomval, .hide-xs { display: none; }
  }
</style>
</head>

<body>

<main class="stage" id="stage">
  <div class="progress" id="progress"></div>
  <div class="inner" id="inner"></div>
  <div class="loader" id="loader">
    <div class="spin-lg"></div>
    <p id="loaderMsg">Cargando catálogo…</p>
  </div>
</main>

<nav class="toolbar" aria-label="Controles del catálogo">
  <button class="btn" id="prev" title="Anterior (←)" aria-label="Página anterior">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="info" id="info" aria-live="polite">–</div>
  <button class="btn" id="next" title="Siguiente (→)" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <span class="sep"></span>

  <button class="btn" id="zoomOut" title="Alejar (−)" aria-label="Alejar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
  </button>
  <div class="zoomval" id="zoomVal">100%</div>
  <button class="btn" id="zoomIn" title="Acercar (+)" aria-label="Acercar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg>
  </button>

  <span class="sep"></span>

  <button class="btn" id="fs" title="Pantalla completa (F)" aria-label="Pantalla completa">
    <svg id="fsIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
  <a class="btn hide-xs" id="dl" title="Descargar PDF" aria-label="Descargar PDF" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
  </a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function () {
  'use strict';

  /* ================= Configuración ================= */
  const PDF_URL   = 'https://farmdirect.com/wp-content/uploads/2026/08/Farm-Direct-Catalog-2026-1.pdf';
  const RENDER_W  = 1600;            // ancho en px al que se rasteriza cada página (nitidez con zoom)
  const ZOOMS     = [1, 1.5, 2, 3];  // niveles de zoom
  const PORTRAIT_GAIN = 1.25;        // pasa a página única si así la página crece al menos 25 %

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ================= Estado ================= */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), inner = $('inner');
  let pdf = null, N = 0, ratio = 0.707;
  let urls = [], nodes = [], failed = new Set();
  let pf = null, curIdx = 0, zi = 0, portrait = false;
  let rendering = false, doneCount = 0, resizeT = null;

  $('dl').href = PDF_URL;

  /* ================= Medidas: llenar el ancho sin franjas ================= */
  function measure() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const hSpread = Math.min(sh, sw / (2 * ratio));  // alto de página en doble página
    const hSingle = Math.min(sh, sw / ratio);        // alto de página en página única
    portrait = hSingle > hSpread * PORTRAIT_GAIN;
    const z = ZOOMS[zi];
    const ph = Math.floor((portrait ? hSingle : hSpread) * z);
    const pw = Math.floor(ph * ratio);
    return { pw, ph };
  }

  /* ================= Construcción del libro ================= */
  function build(startPage) {
    if (pf) { try { pf.destroy(); } catch (e) {} pf = null; }
    inner.innerHTML = '';

    const { pw, ph } = measure();
    const el = document.createElement('div');
    el.className = 'book';
    el.style.width  = (portrait ? pw : pw * 2) + 'px';
    el.style.height = ph + 'px';
    inner.appendChild(el);

    nodes = [];
    for (let i = 0; i < N; i++) {
      const p = document.createElement('div');
      p.className = 'page';
      if (i === 0 || i === N - 1) p.dataset.density = 'hard';
      p.innerHTML = '<div class="spin"></div><img alt="Página ' + (i + 1) + '" draggable="false">';
      nodes.push(p);
      el.appendChild(p);
      if (urls[i]) fill(i);
    }

    pf = new St.PageFlip(el, {
      width: pw, height: ph, size: 'fixed',
      showCover: true, drawShadow: true, maxShadowOpacity: 0.5,
      flippingTime: 800, usePortrait: true, startPage: Math.min(startPage, N - 1),
      mobileScrollSupport: true, swipeDistance: 30, clickEventForward: true,
      useMouseEvents: true, autoSize: false
    });
    pf.loadFromHTML(nodes);
    pf.on('flip', e => { curIdx = e.data; updateUI(); renderLoop(); });

    curIdx = Math.min(startPage, N - 1);
    updateUI();
    stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) / 2;
    stage.scrollTop  = (stage.scrollHeight - stage.clientHeight) / 2;
  }

  function fill(i) {
    const n = nodes[i];
    if (!n || !urls[i]) return;
    const img = n.querySelector('img');
    if (img.src !== urls[i]) img.src = urls[i];
    n.classList.add('ready');
  }

  /* ================= Render de páginas PDF (prioriza las cercanas) ================= */
  async function renderLoop() {
    if (rendering) return;
    rendering = true;
    try {
      for (;;) {
        let next = -1, best = Infinity;
        for (let i = 0; i < N; i++) {
          if (urls[i] || failed.has(i)) continue;
          const d = Math.abs(i - curIdx);
          if (d < best) { best = d; next = i; }
        }
        if (next < 0) break;
        await renderPage(next);
      }
    } finally { rendering = false; }
  }

  async function renderPage(i) {
    try {
      const page = await pdf.getPage(i + 1);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: RENDER_W / vp0.width });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const ctx = c.getContext('2d', { alpha: false });
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
      c.width = c.height = 0;
      urls[i] = URL.createObjectURL(blob);
      page.cleanup();
      fill(i);
    } catch (err) {
      console.error('Error renderizando página', i + 1, err);
      failed.add(i);
    }
    doneCount++;
    $('progress').style.width = (doneCount / N * 100) + '%';
    if (doneCount >= N) setTimeout(() => $('progress').style.opacity = 0, 600);
    if (i === 0) $('loader').classList.add('hide');
  }

  /* ================= UI ================= */
  function updateUI() {
    const i = curIdx;
    let txt;
    if (portrait || i === 0 || i >= N - 1) txt = (i + 1) + ' / ' + N;
    else txt = (i + 1) + '–' + Math.min(i + 2, N) + ' / ' + N;
    $('info').textContent = txt;
    $('prev').disabled = i <= 0;
    $('next').disabled = i >= N - 1 || (!portrait && i + 2 >= N - 0 && i >= N - 2);
    $('zoomOut').disabled = zi === 0;
    $('zoomIn').disabled  = zi === ZOOMS.length - 1;
    $('zoomVal').textContent = Math.round(ZOOMS[zi] * 100) + '%';
  }

  function setZoom(n) {
    n = Math.max(0, Math.min(ZOOMS.length - 1, n));
    if (n === zi) return;
    zi = n;
    build(curIdx);
  }

  const go = dir => { if (!pf) return; dir > 0 ? pf.flipNext() : pf.flipPrev(); };

  $('prev').onclick    = () => go(-1);
  $('next').onclick    = () => go(1);
  $('zoomIn').onclick  = () => setZoom(zi + 1);
  $('zoomOut').onclick = () => setZoom(zi - 1);

  /* Pantalla completa */
  const root = document.documentElement;
  const reqFS  = root.requestFullscreen || root.webkitRequestFullscreen;
  const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
  const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function toggleFS() {
    if (!reqFS) return;
    if (isFS()) exitFS.call(document); else reqFS.call(root);
  }
  if (!reqFS) $('fs').style.display = 'none';
  $('fs').onclick = toggleFS;
  function fsChanged() {
    $('fsIcon').innerHTML = isFS()
      ? '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'
      : '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>';
    scheduleRebuild();
  }
  document.addEventListener('fullscreenchange', fsChanged);
  document.addEventListener('webkitfullscreenchange', fsChanged);

  /* Teclado */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
    else if (e.key === '+' || e.key === '=') setZoom(zi + 1);
    else if (e.key === '-') setZoom(zi - 1);
    else if (e.key === '0') setZoom(0);
    else if (e.key === 'f' || e.key === 'F') toggleFS();
  });

  /* Redimensionado: se reconstruye con el nuevo tamaño exacto */
  function scheduleRebuild() {
    if (!N) return;
    clearTimeout(resizeT);
    resizeT = setTimeout(() => build(curIdx), 150);
  }
  window.addEventListener('resize', scheduleRebuild);
  window.addEventListener('orientationchange', scheduleRebuild);

  /* ================= Arranque ================= */
  function showError(err) {
    console.error(err);
    const l = $('loader');
    l.classList.add('error');
    l.classList.remove('hide');
    l.innerHTML = '<p>No se pudo cargar el catálogo.<br>' +
      '<a href="' + PDF_URL + '" target="_blank" rel="noopener">Abrir el PDF directamente</a></p>' +
      '<p style="font-size:12px;opacity:.7">Si el visor está alojado en otro dominio, el servidor del PDF debe permitir CORS.</p>';
  }

  (async function init() {
    try {
      pdf = await pdfjsLib.getDocument({ url: PDF_URL }).promise;
      N = pdf.numPages;
      const p1 = await pdf.getPage(1);
      const vp = p1.getViewport({ scale: 1 });
      ratio = vp.width / vp.height;
      urls = new Array(N).fill(null);
      build(0);
      renderLoop();
    } catch (err) { showError(err); }
  })();
})();
</script>
</body>
</html>
